name: Research infrastructure checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/export-public-data.py
      - run: git diff --exit-code -- data site/lib/data/public-release.json
      - run: python scripts/check-docs.py
      - run: python scripts/validate-data.py
      - run: python -m unittest discover -s tests -v
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm audit --audit-level=high
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:browser
        working-directory: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: reports/browser.json
          if-no-files-found: ignore
