{
  "name": "Missing event / 补充事件",
  "description": "Missing event / 补充事件 — evidence and original links / 请附证据与原链接",
  "title": "[Event] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Public submission: do not include private drafts, personal sensitive information or third-party full texts. / 公开提交，请勿包含私有草稿、敏感个人信息或第三方全文。"
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Date, precision, title, actors and region / 日期、精度、标题、主体与地区"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Original source URL(s), publication date and language / 原始来源链接、发布日期与语言"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "proposal",
      "attributes": {
        "label": "What changed, and which existing case does it belong to? / 发生了什么变化，属于哪个案例？"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "review",
      "attributes": {
        "label": "Translation origin and review / 翻译来源与审校",
        "description": "If relevant, distinguish AI-assisted text, your translation and independent review. / 如涉及翻译，请区分 AI 辅助、本人翻译与独立审校。"
      }
    }
  ]
}
