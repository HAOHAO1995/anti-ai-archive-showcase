{
  "name": "Factual correction / 事实纠错",
  "description": "Provide a specific proposal and original evidence. / 请提供具体建议与原始证据。",
  "title": "[Correction] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Issues are public. Do not submit private drafts, sensitive personal information, credentials or third-party full texts. Unknown dates and languages may be marked unknown. / Issues 为公开内容，请勿提交私有草稿、敏感个人信息、凭据或第三方全文。日期或语言未知时请注明未知。"
      }
    },
    {
      "type": "input",
      "id": "archive_record",
      "attributes": {
        "label": "Archive page / case / 档案页面或案例",
        "description": "URL or stable ID; for a new case or source, write “not yet catalogued”. / 提供网址或稳定编号；新案例或来源可填“尚未编目”。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "source_url",
      "attributes": {
        "label": "Original source URL / 原始来源网址",
        "description": "Link the original public evidence, preserving its language. For a broken link, include the affected URL. / 链接公开原始证据，保留原语言；失效链接问题请提供原失效网址。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "publication_date",
      "attributes": {
        "label": "Publication date / 来源发布日期",
        "description": "Use the precision supported by the source, or “unknown”; distinguish this from the event date. / 按来源支持的精度填写，未知则注明；与事件日期区分。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "source_language",
      "attributes": {
        "label": "Source language / 来源语言",
        "description": "Original language, and any verified official translation if relevant; unknown is acceptable. / 原语言及已核实的官方译本（如相关）；允许注明未知。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "requested_change",
      "attributes": {
        "label": "Requested addition / correction / 建议补充或修正",
        "description": "Quote the current wording briefly, propose a correction, and distinguish allegations, announcements, filings, rulings, settlements and implementation. / 简引现有表述，提出修改，并区分指控、公告、诉状、裁判、和解与实施。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "supporting_context",
      "attributes": {
        "label": "Supporting context (optional) / 补充说明（可选）",
        "description": "Relevant evidence, attribution, limitations or review status. Links and short descriptions suffice. / 相关证据、归属、限制或审查状态；链接与简要说明即可。"
      },
      "validations": {
        "required": false
      }
    }
  ]
}
