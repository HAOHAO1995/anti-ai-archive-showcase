{
  "name": "Source or record correction / 来源或记录勘误",
  "description": "Source or record correction / 来源或记录勘误 — evidence and original links / 请附证据与原链接",
  "title": "[Correction] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Public submission: do not include private drafts, personal sensitive information or third-party full texts. / 公开提交，请勿包含私有草稿、敏感个人信息或第三方全文。"
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Archive URL or stable ID / 档案页面或稳定编号"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Original source URL(s), publication date and language / 原始来源链接、发布日期与语言"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "proposal",
      "attributes": {
        "label": "Current wording, proposed correction and supporting evidence / 现有表述、建议修正与证据"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "review",
      "attributes": {
        "label": "Translation origin and review / 翻译来源与审校",
        "description": "If relevant, distinguish AI-assisted text, your translation and independent review. / 如涉及翻译，请区分 AI 辅助、本人翻译与独立审校。"
      }
    }
  ]
}
